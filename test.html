<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Testmonials</title>
  <style>
    h1 {
      color: #00bfff;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0 15px;
      padding-top: 160px;
      color: #333;
      background: #f9f9f9;
    }
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      background-color: #edf5f5;
      padding: 30px 0 20px 0;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    /* Carousel styles */
    .carousel-container {
      max-width: 600px;
      margin: 2em auto;
      overflow: hidden;
      position: relative;
    }
    .carousel-slides {
      display: flex;
      transition: transform 0.5s ease;
    }
    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 1em;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-style: italic;
      font-size: 1.1em;
    }
    .carousel-dots {
      text-align: center;
      margin-top: 1em;
    }
    .carousel-dot {
      height: 12px;
      width: 12px;
      margin: 0 4px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
    }
    .carousel-dot.active {
      background-color: #333;
    }
  </style>
</head>
<body>

    <h1 style="margin-bottom: 20px;">

      <span style="color: green; font-weight: bold;">Readers
